# Notify ai-maestro-plugins marketplace when this plugin is updated
name: Notify Marketplace

on:
  push:
    branches: [main, master]
    paths:
      - '.claude-plugin/**'
      - 'hooks/**'
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'

env:
  MARKETPLACE_OWNER: '23blocks-OS'
  MARKETPLACE_REPO: 'ai-maestro-plugins'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: plugin
        run: |
          PLUGIN_JSON=".claude-plugin/plugin.json"
          echo "name=$(jq -r '.name' $PLUGIN_JSON)" >> $GITHUB_OUTPUT
          echo "version=$(jq -r '.version' $PLUGIN_JSON)" >> $GITHUB_OUTPUT
          echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Trigger marketplace update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          repository: ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}
          event-type: plugin-updated
          client-payload: |
            {
              "plugin": "${{ steps.plugin.outputs.name }}",
              "version": "${{ steps.plugin.outputs.version }}",
              "ref": "${{ steps.plugin.outputs.ref }}",
              "triggered_by": "${{ github.actor }}"
            }

      - name: Summary
        run: |
          echo "## Marketplace Notification" >> $GITHUB_STEP_SUMMARY
          echo "Triggered update in ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "- Plugin: ${{ steps.plugin.outputs.name }} v${{ steps.plugin.outputs.version }}" >> $GITHUB_STEP_SUMMARY
